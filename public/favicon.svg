  <!-- Developer code brackets and slash &lt;/&gt; -->
  <path d="M10.5 10.5L5.5 16L10.5 21.5" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M18 9.5L14 22.5" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M21.5 10.5L26.5 16L21.5 21.5" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
